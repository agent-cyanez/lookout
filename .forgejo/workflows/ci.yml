name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: python3 -m py_compile lookout.py
      - name: Test
        run: python3 -m unittest discover -s tests -v
        env:
          PYTHONPATH: .
