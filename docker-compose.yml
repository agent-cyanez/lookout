services:
  lookout:
    build: .
    container_name: lookout
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - path: .env
        required: false
    environment:
      - NTFY_URL=http://127.0.0.1:8888
      - NTFY_TOPIC=vela
      - NTFY_MAX_PRIORITY=default
      - POLL_INTERVAL=30
      - NOTIFY_ON_START=true
      # Glob patterns supported (fnmatch). Prefix ! to exclude.
